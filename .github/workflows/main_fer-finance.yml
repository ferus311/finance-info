name: Build and deploy Next.js app to Azure Web App - fer-finance

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js version
              uses: actions/setup-node@v4
              with:
                  node-version: '22.x'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Build project
              run: npm run build
              env:
                  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

            - name: Prepare standalone package
              run: |
                  rm -rf deploy
                  mkdir -p deploy/.next
                  cp -r .next/standalone/* deploy/
                  cp -r .next/static deploy/.next/static
                  if [ -d public ]; then cp -r public deploy/public; fi

            - name: Upload artifact for deployment job
              uses: actions/upload-artifact@v4
              with:
                  name: node-app
                  path: deploy

    deploy:
        runs-on: ubuntu-latest
        needs: build
        permissions:
            id-token: write
            contents: read

        steps:
            - name: Download artifact from build job
              uses: actions/download-artifact@v4
              with:
                  name: node-app
                  path: deploy

            - name: Login to Azure
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BDC67B2ADDB44273BE064ECDB1CAFD55 }}
                  tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_22F5D4DDBC0240A5976B3119C089B0F0 }}
                  subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_27CF9F41D0F94632A724B0D848A32957 }}

            - name: 'Deploy to Azure Web App'
              id: deploy-to-webapp
              uses: azure/webapps-deploy@v3
              with:
                  app-name: 'fer-finance'
                  slot-name: 'Production'
                  package: ./deploy
